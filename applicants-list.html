<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Applicants List</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
  <h2>Applicants for: [[${job.title}]]</h2>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Applicant Name</th>
        <th>Email</th>
        <th>Status</th>
        <th>Resume</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="application : ${applications}">
        <td th:text="${application.applicant.fullName}"></td>
        <td th:text="${application.applicant.email}"></td>
        <td th:text="${application.status}"></td>
        <td>
          <a th:href="@{'/uploads/' + ${application.resumePath}}" target="_blank" class="btn btn-sm btn-link">View Resume</a>
        </td>
        <td>
          <form th:action="@{'/application/status/' + ${application.id}}" method="post">
            <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
              <option value="PENDING">Pending</option>
              <option value="ACCEPTED">Accepted</option>
              <option value="REJECTED">Rejected</option>
            </select>
            <input type="hidden" name="jobId" th:value="${job.id}">
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
