<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Post a Job</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
  <h2>Post New Job</h2>
  <form th:action="@{/job/post}" th:object="${job}" method="post">
    <div class="mb-3">
      <label>Job Title</label>
      <input type="text" th:field="*{title}" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Company Name</label>
      <input type="text" th:field="*{companyName}" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Location</label>
      <input type="text" th:field="*{location}" class="form-control">
    </div>

    <div class="mb-3">
      <label>Job Type</label>
      <input type="text" th:field="*{jobType}" placeholder="Full-time, Part-time" class="form-control">
    </div>

    <div class="mb-3">
      <label>Description</label>
      <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
    </div>

    <button class="btn btn-success">Submit</button>
    <a href="/job/employer/dashboard" class="btn btn-secondary">Cancel</a>
  </form>
</div>
</body>
</html>
