<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>View Jobs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
  <h2 class="mb-3">Available Job Listings</h2>

  <form method="get" th:action="@{/job/all}" class="d-flex mb-3">
    <input class="form-control me-2" type="search" name="title" placeholder="Search job title" th:value="${filterTitle}">
    <button class="btn btn-outline-primary" type="submit">Search</button>
  </form>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Title</th>
        <th>Company</th>
        <th>Location</th>
        <th>Type</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="job : ${jobs}">
        <td th:text="${job.title}"></td>
        <td th:text="${job.companyName}"></td>
        <td th:text="${job.location}"></td>
        <td th:text="${job.jobType}"></td>
        <td><a th:href="@{'/job/' + ${job.id}}" class="btn btn-sm btn-info">View</a></td>
      </tr>
    </tbody>
  </table>

  <div th:if="${totalPages > 1}" class="text-center mt-3">
    <ul class="pagination justify-content-center">
      <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
          th:classappend="${i == currentPage} ? 'page-item active' : 'page-item'">
        <a class="page-link" th:href="@{/job/all(page=${i})}" th:text="${i + 1}"></a>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
