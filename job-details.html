<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Job Details</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
  <h2 th:text="${job.title}"></h2>
  <p><b>Company: </b><span th:text="${job.companyName}"></span></p>
  <p><b>Location: </b><span th:text="${job.location}"></span></p>
  <p><b>Type: </b><span th:text="${job.jobType}"></span></p>
  <p><b>Description:</b></p>
  <p th:text="${job.description}"></p>

  <hr>
  <h4>Apply for this Job</h4>
  <form th:action="@{'/application/apply/' + ${job.id}}" method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label>Cover Letter</label>
      <textarea name="coverLetter" class="form-control" rows="4"></textarea>
    </div>
    <div class="mb-3">
      <label>Upload Resume</label>
      <input type="file" name="resume" class="form-control">
    </div>
    <button class="btn btn-success">Apply Now</button>
  </form>
</div>
</body>
</html>
