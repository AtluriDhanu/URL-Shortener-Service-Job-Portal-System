<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Applicant Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
  <h2>Welcome, [[${applicant.fullName}]]!</h2>
  <p class="text-muted">Your submitted job applications.</p>

  <table class="table table-hover">
    <thead>
      <tr>
        <th>Job Title</th>
        <th>Company</th>
        <th>Status</th>
        <th>Applied Date</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="application : ${applications}">
        <td th:text="${application.job.title}"></td>
        <td th:text="${application.job.companyName}"></td>
        <td th:text="${application.status}"></td>
        <td th:text="${#temporals.format(application.appliedDate, 'dd-MM-yyyy')}"></td>
      </tr>
    </tbody>
  </table>

  <a href="/job/all" class="btn btn-secondary">Browse Jobs</a>
</div>
</body>
</html>
